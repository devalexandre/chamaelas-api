<h1>Editar tarifa</h1>
<p class="subtitle">Altere o dia, horário, escopo ou as faixas de km.</p>

<div class="card">
  <form method="post" action="/admin/pricing/{{.Rule.ID}}/update">
    <div class="form-row">
      <div class="field">
        <label for="dayOfWeek">Dia da semana</label>
        <select id="dayOfWeek" name="dayOfWeek" required>
          {{$currentDay := .Rule.DayOfWeek}}
          {{range $i, $name := .Weekdays}}
            <option value="{{$i}}"{{if eq $i $currentDay}} selected{{end}}>{{$name}}</option>
          {{end}}
        </select>
      </div>
      <div class="field">
        <label for="startTime">Início</label>
        <input id="startTime" name="startTime" type="time" value="{{.Rule.StartTime}}" required>
      </div>
      <div class="field">
        <label for="endTime">Fim</label>
        <input id="endTime" name="endTime" type="time" value="{{.Rule.EndTime}}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="cityId">Cidade</label>
        <select id="cityId" name="cityId">
          <option value="">Todas as cidades</option>
          {{range .Cities}}<option value="{{.ID}}"{{if eq .ID $.SelectedCityID}} selected{{end}}>{{.Name}}/{{.UF}}</option>{{end}}
        </select>
      </div>
      <div class="field">
        <label for="categoryId">Categoria</label>
        <select id="categoryId" name="categoryId">
          <option value="">Todas as categorias</option>
          {{range .Categories}}<option value="{{.ID}}"{{if eq .ID $.SelectedCategoryID}} selected{{end}}>{{.Name}}</option>{{end}}
        </select>
      </div>
    </div>

    <label>Faixas de km</label>
    <p class="hint-text" style="text-align:left; padding:0 0 0.4rem;">
      Preencha "Preço fixo", "Preço por km", ou os dois — o valor final da faixa é fixo + (preço por km × distância da corrida).
    </p>
    <div id="brackets">
      {{range .Rule.Brackets}}
      <div class="form-row bracket-row">
        <div class="field"><input name="kmFrom[]" type="number" step="0.1" min="0" placeholder="De (km)" value="{{.KmFrom}}" required></div>
        <div class="field"><input name="kmTo[]" type="number" step="0.1" min="0" placeholder="Até (km)" value="{{if .KmTo}}{{.KmTo}}{{end}}"></div>
        <div class="field"><input name="price[]" type="number" step="0.01" min="0" placeholder="Preço fixo (R$)" value="{{if .Price}}{{.Price}}{{end}}"></div>
        <div class="field"><input name="pricePerKm[]" type="number" step="0.01" min="0" placeholder="Preço por km (R$)" value="{{if .PricePerKm}}{{.PricePerKm}}{{end}}"></div>
        <button type="button" class="btn btn-ghost btn-sm remove-row" style="align-self:center;">Remover</button>
      </div>
      {{end}}
    </div>
    <button type="button" id="add-bracket" class="btn btn-ghost btn-sm" style="margin:0.6rem 0 1rem;">+ Adicionar faixa de km</button>

    <div style="display:flex; gap:0.6rem;">
      <button class="btn btn-primary" type="submit">Salvar alterações</button>
      <a class="btn btn-ghost" href="/admin/pricing">Cancelar</a>
    </div>
  </form>
</div>

<script>
  document.getElementById('add-bracket').addEventListener('click', function () {
    var container = document.getElementById('brackets');
    var row = container.querySelector('.bracket-row').cloneNode(true);
    row.querySelectorAll('input').forEach(function (input) { input.value = ''; });
    container.appendChild(row);
  });

  document.getElementById('brackets').addEventListener('click', function (e) {
    if (!e.target.classList.contains('remove-row')) return;
    var rows = document.querySelectorAll('.bracket-row');
    if (rows.length > 1) e.target.closest('.bracket-row').remove();
  });
</script>
